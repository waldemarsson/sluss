name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The four targets a release publishes, so a build break shows up here rather
      # than at tag time.
      - name: Build released targets
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "/tmp/sluss-$os-$arch" ./cmd/sluss
          done
      - name: Check shell scripts
        run: |
          sh -n scripts/install.sh scripts/uninstall.sh
          bash -n scripts/test-install
          shellcheck scripts/install.sh scripts/uninstall.sh scripts/test-install
      - name: Test the install and uninstall scripts
        run: ./scripts/test-install

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: web/dashboard
        run: npm ci
      # Cheapest gate in the job, so it runs before the Chromium download rather than after it.
      - name: Check dashboard formatting
        working-directory: web/dashboard
        run: npm run format:check
      # The component project renders into a real Chromium (see web/dashboard/vite.config.ts).
      # `--with-deps` pulls the system libraries the browser needs, which the GitHub runner image
      # does not carry by default; without it the run fails at browser launch, not an assertion.
      # The devcontainer deliberately does the opposite split — libraries baked into the image,
      # browser downloaded without root — because it drops its sudo rule; see .devcontainer/Dockerfile.
      - name: Install Playwright Chromium
        working-directory: web/dashboard
        run: npx playwright install --with-deps chromium
      - name: Type-check dashboard
        working-directory: web/dashboard
        run: npm run check
      # Before the build, so a logic failure reports without waiting on the slower step.
      - name: Test dashboard
        working-directory: web/dashboard
        run: |
          npm run test:unit
          npm run test:component
      - name: Build dashboard
        working-directory: web/dashboard
        run: npm run build
