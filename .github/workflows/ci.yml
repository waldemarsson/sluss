name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build supported targets
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/sluss-darwin-arm64 ./cmd/sluss
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/sluss-linux-amd64 ./cmd/sluss
      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh scripts/sluss scripts/test-sluss
          shellcheck scripts/install.sh scripts/sluss scripts/test-sluss
      - name: Test shell scripts
        run: ./scripts/test-sluss
