name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build supported targets
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/slussd-darwin-arm64 ./cmd/slussd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/slussd-linux-amd64 ./cmd/slussd
      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh scripts/sluss scripts/test-sluss
          shellcheck scripts/install.sh scripts/sluss scripts/test-sluss
      - name: Test shell scripts
        run: ./scripts/test-sluss

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: web/dashboard
        run: npm ci
      # The component project renders into a real Chromium (see web/dashboard/vite.config.js).
      # `--with-deps` pulls the system libraries the browser needs, which the GitHub runner image
      # does not carry by default; without it the run fails at browser launch, not an assertion.
      # The devcontainer deliberately does the opposite split — libraries baked into the image,
      # browser downloaded without root — because it drops its sudo rule; see .devcontainer/Dockerfile.
      - name: Install Playwright Chromium
        working-directory: web/dashboard
        run: npx playwright install --with-deps chromium
      - name: Type-check dashboard
        working-directory: web/dashboard
        run: npm run check
      # Before the build, so a logic failure reports without waiting on the slower step.
      - name: Test dashboard
        working-directory: web/dashboard
        run: |
          npm run test:unit
          npm run test:component
      - name: Build dashboard
        working-directory: web/dashboard
        run: npm run build
