version: "3"

vars:
  BIN: dist/sluss

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task: check

  web:
    desc: Build the dashboard into web/dashboard/build, where go:embed picks it up
    dir: web/dashboard
    cmds:
      - npm ci
      - npm run build

  build:
    desc: Build for the host platform
    deps: [web]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/sluss

  build:linux:
    desc: Cross-compile for a Linux host
    deps: [web]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}}-linux ./cmd/sluss

  install:
    desc: Install the locally built binary to ~/.local/bin
    deps: [build]
    cmds:
      - install -m 0755 {{.BIN}} "${SLUSS_INSTALL_DIR:-$HOME/.local/bin}/sluss"

  spike:proxy:
    desc: Cross-compile the M0 spike proxy for the host Mac (docs/SPIKE-RUNBOOK.md)
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - go build -o dist/spike-proxy ./spike/proxy

  fmt:
    desc: Format all Go source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if anything is not gofmt'd
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt'd (run 'task fmt'):" >&2
          echo "$unformatted" >&2
          exit 1
        fi

  fmt:web:
    desc: Format the dashboard with Prettier
    dir: web/dashboard
    cmds:
      - npm run format

  vet:
    cmds:
      - go vet ./...

  test:
    cmds:
      - go test ./...

  check:web:
    desc: Prettier and svelte-check over the dashboard
    dir: web/dashboard
    cmds:
      # Formatting first: it is the cheaper failure and the one with a one-command fix.
      - npm run format:check
      - npm run check

  test:web:
    desc: Dashboard unit + component tests (component tests need Chromium)
    dir: web/dashboard
    cmds:
      - npm run test:unit
      - npm run test:component

  test:install:
    desc: Black-box tests for the install and uninstall scripts, against a file:// remote
    cmds:
      - ./scripts/test-install

  check:
    desc: What must pass before finishing a change (AGENTS.md)
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - sh -n scripts/install.sh scripts/uninstall.sh
      - bash -n scripts/test-install
      - shellcheck scripts/install.sh scripts/uninstall.sh scripts/test-install
      - task: test:install

  clean:
    cmds:
      - rm -rf dist
